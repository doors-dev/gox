name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        id: check
        run: |
          set -euxo pipefail
          sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.on_main == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: Linux
            goarch: amd64
            exe: gox
          - os: ubuntu-24.04-arm
            goos: Linux
            goarch: arm64
            exe: gox
          - os: macos-latest
            goos: Darwin
            goarch: arm64
            exe: gox
          - os: macos-15-intel
            goos: Darwin
            goarch: amd64
            exe: gox
          - os: windows-latest
            goos: Windows
            goarch: amd64
            exe: gox.exe
          - os: windows-11-arm
            goos: Windows
            goarch: arm64
            exe: gox.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: runner.os != 'Windows'
        with:
          go-version: "stable"
          cache: true

      - name: Install Rust (Linux/macOS)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.goos == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup MSYS2 (Windows amd64)
        if: matrix.goos == 'Windows' && matrix.goarch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-go
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-libunwind
            
      - name: Setup MSYS2 (Windows arm64)
        if: matrix.goos == 'Windows' && matrix.goarch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          path-type: inherit
          install: >-
            make
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-go
            mingw-w64-clang-aarch64-rust

      - name: Build (Linux/macOS)
        if: matrix.goos != 'Windows'
        run: make build
          
      - name: Build (Windows)
        if: matrix.goos == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euxo pipefail
          git reset --hard
          git clean -fdx
          make build
          
      - name: Stage output
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp -f "./${{ matrix.exe }}" "out/${{ matrix.exe }}"
          cp -f LICENSE out/LICENSE

      - name: Upload build output (per platform)
        uses: actions/upload-artifact@v4
        with:
          name: gox_${{ matrix.goos }}_${{ matrix.goarch }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Ensure the workflow was dispatched from a tag
        if: github.ref_type != 'tag'
        run: |
          echo "Release must be dispatched from a tag, got ${{ github.ref_type }} '${{ github.ref_name }}'." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Package assets
        run: |
          set -euxo pipefail
          mkdir -p dist

          # upload-artifact does not preserve modes, so the exec bit is restored here
          chmod +x \
            "builds/gox_Linux_amd64/gox" \
            "builds/gox_Linux_arm64/gox" \
            "builds/gox_Darwin_arm64/gox" \
            "builds/gox_Darwin_amd64/gox"

          # Artifact folders contain gox or gox.exe directly
          tar -C "builds/gox_Linux_amd64"  -czf "dist/gox_linux_amd64.tar.gz" .
          tar -C "builds/gox_Linux_arm64"  -czf "dist/gox_linux_arm64.tar.gz" .
          tar -C "builds/gox_Darwin_arm64" -czf "dist/gox_darwin_arm64.tar.gz" .
          tar -C "builds/gox_Darwin_amd64" -czf "dist/gox_darwin_amd64.tar.gz" .
          (cd "builds/gox_Windows_amd64" && zip -r "../../dist/gox_windows_amd64.zip" .)
          (cd "builds/gox_Windows_arm64" && zip -r "../../dist/gox_windows_arm64.zip" .)

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create/Update GitHub Release and upload assets (once)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        id: check
        run: |
          set -euxo pipefail
          sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.on_main == 'true'
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Ensure the workflow was dispatched from a tag
        if: github.ref_type != 'tag'
        run: |
          echo "Release must be dispatched from a tag, got ${{ github.ref_type }} '${{ github.ref_name }}'." >&2
          exit 1

      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Package assets
        run: |
          set -euxo pipefail
          mkdir -p dist

          # upload-artifact does not preserve modes, so the exec bit is restored here
          chmod +x \
            "builds/gox_Linux_amd64/gox" \
            "builds/gox_Linux_arm64/gox" \
            "builds/gox_Darwin_arm64/gox" \
            "builds/gox_Darwin_amd64/gox"

          # Artifact folders contain gox or gox.exe directly
          tar -C "builds/gox_Linux_amd64"  -czf "dist/gox_linux_amd64.tar.gz" .
          tar -C "builds/gox_Linux_arm64"  -czf "dist/gox_linux_arm64.tar.gz" .
          tar -C "builds/gox_Darwin_arm64" -czf "dist/gox_darwin_arm64.tar.gz" .
          tar -C "builds/gox_Darwin_amd64" -czf "dist/gox_darwin_amd64.tar.gz" .
          (cd "builds/gox_Windows_amd64" && zip -r "../../dist/gox_windows_amd64.zip" .)
          (cd "builds/gox_Windows_arm64" && zip -r "../../dist/gox_windows_arm64.zip" .)

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create/Update GitHub Release and upload assets (once)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*
